[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpn"
version = "0.9.0a1"
description = "Genomic pretrained networks for sequence and alignment-based inference"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gonzalo Benegas", email = "gbenegas@berkeley.edu" },
  { name = "Chengzhong Ye", email = "czye@berkeley.edu" },
]
keywords = [
  "bioinformatics",
  "genomics",
  "machine-learning",
  "transformers",
  "variant-effect-prediction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "huggingface-hub>=0.26",
  "jaxtyping>=0.3.2",
  "networkx>=3.2",
  "numpy>=1.26",
  "torch>=2.5",
  "transformers==5.15.0",
]

[project.optional-dependencies]
inference = [
  "accelerate>=1",
  "biopython>=1.83",
  "datasets>=3",
  "joblib>=1.3",
  "pandas>=2.1",
  "pyarrow>=15",
  "tqdm>=4.66",
  "zarr>=2.17,<4",
]
train = [
  "accelerate>=1",
  "biopython>=1.83",
  "datasets>=3",
  "joblib>=1.3",
  "pandas>=2.1",
  "pyarrow>=15",
  "tqdm>=4.66",
  "zarr>=2.17,<4",
  "zstandard>=0.22",
]
tracking = ["wandb>=0.18"]

[project.urls]
Issues = "https://github.com/songlab-cal/gpn/issues"
Repository = "https://github.com/songlab-cal/gpn"

[dependency-groups]
dev = [
  "check-wheel-contents>=0.6",
  "pytest>=8.3",
  "ruff>=0.11",
  "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpn"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/gpn",
  "/docs",
  "/recipes",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "published_models: opt-in tests that download pinned Hugging Face checkpoints",
]

[tool.ruff]
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
