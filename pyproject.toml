[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpn"
version = "0.9.0a1"
description = "Genomic pretrained networks for sequence and alignment-based inference"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gonzalo Benegas", email = "gbenegas@berkeley.edu" },
  { name = "Chengzhong Ye", email = "czye@berkeley.edu" },
]
keywords = [
  "bioinformatics",
  "genomics",
  "machine-learning",
  "transformers",
  "variant-effect-prediction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "cyclopts>=4.22.5,<5",
  "huggingface-hub>=0.26",
  "jaxtyping>=0.3.2",
  "networkx>=3.2",
  "numpy>=1.26",
  "torch>=2.5",
  "transformers==5.15.0",
]

[project.scripts]
gpn = "gpn.cli:main"

[project.optional-dependencies]
inference = [
  "accelerate>=1",
  "biopython>=1.83",
  "datasets>=3",
  "pandas>=2.1",
  "pyarrow>=15",
  "zarr>=2.17,<4",
]
train = [
  "accelerate>=1",
  "biopython>=1.83",
  "datasets>=3",
  "pandas>=2.1",
  "pyarrow>=15",
  "zarr>=2.17,<4",
  "pyyaml>=6.0.2",
  "zstandard>=0.22",
]
tracking = ["wandb>=0.18"]

[project.urls]
Issues = "https://github.com/songlab-cal/gpn/issues"
Repository = "https://github.com/songlab-cal/gpn"

[dependency-groups]
dev = [
  "check-wheel-contents>=0.6",
  "deptry>=0.24",
  "mypy>=1.18",
  "pre-commit>=4.2",
  "pytest>=8.3",
  "ruff>=0.16.3",
  "types-pyyaml>=6.0.12.20250915",
  "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpn"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/gpn",
  "/docs",
  "/recipes",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "published_models: opt-in tests that download pinned Hugging Face checkpoints",
]

[tool.mypy]
python_version = "3.13"
files = [
  "src/gpn/cli.py",
  "src/gpn/_registration.py",
  "src/gpn/arguments.py",
  "src/gpn/checkpoint.py",
  "src/gpn/inference.py",
  "src/gpn/ss/data.py",
  "src/gpn/ss/inference.py",
  "src/gpn/msa/data.py",
  "src/gpn/msa/inference.py",
  "src/gpn/star/data.py",
  "src/gpn/star/inference.py",
  "src/gpn/scoring.py",
  "src/gpn/training.py",
]
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "accelerate.*",
  "datasets",
  "pandas",
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["gpn"]
ignore_notebooks = true

[tool.deptry.package_module_name_map]
biopython = "Bio"
wandb = "wandb"

[tool.deptry.per_rule_ignores]
# Transformers discovers optional experiment trackers dynamically; FSSpec
# discovers the Zstandard codec dynamically when loading ``*.zst`` shards.
DEP002 = ["wandb", "zstandard"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
force-exclude = true
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Legacy checkpoint classes are intentionally re-exported after their replacements.
"src/gpn/model.py" = ["E402"]
# Pyflakes parses jaxtyping's runtime shape strings as forward annotations.
"src/gpn/phylo/model.py" = ["F722"]
"src/gpn/scoring.py" = ["F722"]
"src/gpn/star/train.py" = ["F722"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
