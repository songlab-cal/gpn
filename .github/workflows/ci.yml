name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --python 3.13 --extra train --group dev

      - name: Check maintained code
        run: |
          uv run ruff format --check \
            src/gpn/__init__.py \
            src/gpn/_registration.py \
            src/gpn/scoring.py \
            src/gpn/training.py \
            tests/conftest.py \
            tests/test_dependency_boundaries.py \
            tests/fixtures/regenerate_alignment_fixture.py \
            tests/test_msa_model_loading.py \
            tests/test_published_models.py \
            tests/test_registration.py \
            tests/test_scientific_fixtures.py \
            tests/test_scoring.py \
            tests/test_training_recipes.py
          uv run ruff check \
            src/gpn/__init__.py \
            src/gpn/_registration.py \
            src/gpn/scoring.py \
            src/gpn/training.py \
            tests/conftest.py \
            tests/test_dependency_boundaries.py \
            tests/fixtures/regenerate_alignment_fixture.py \
            tests/test_msa_model_loading.py \
            tests/test_published_models.py \
            tests/test_registration.py \
            tests/test_scientific_fixtures.py \
            tests/test_scoring.py \
            tests/test_training_recipes.py

      - name: Run offline tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: |
          uv run twine check dist/*
          uv run check-wheel-contents dist/*.whl
