name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --python 3.13 --extra train --group dev

      - name: Run repository checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --python 3.13 --extra train --group dev

      - name: Run offline tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked build tools
        run: uv sync --locked --python 3.13 --group dev

      - name: Build and check distributions
        run: |
          uv build
          uv run twine check dist/*
          uv run check-wheel-contents dist/*.whl

      - name: Rebuild wheel from source distribution
        run: |
          mkdir -p /tmp/gpn-wheel-from-sdist
          uv build dist/gpn-*.tar.gz --wheel --out-dir /tmp/gpn-wheel-from-sdist
          uv run twine check /tmp/gpn-wheel-from-sdist/*.whl
          uv run check-wheel-contents /tmp/gpn-wheel-from-sdist/*.whl

      - name: Smoke-test installed wheel outside the checkout
        run: |
          uv version --short > /tmp/gpn-expected-version
          uv venv --python 3.13 /tmp/gpn-wheel-smoke
          uv pip install \
            --python /tmp/gpn-wheel-smoke/bin/python \
            --torch-backend cpu \
            --no-config \
            /tmp/gpn-wheel-from-sdist/*.whl
          cd /tmp
          /tmp/gpn-wheel-smoke/bin/gpn --version
          /tmp/gpn-wheel-smoke/bin/gpn --help
          /tmp/gpn-wheel-smoke/bin/python -c \
            "from importlib.metadata import version; from pathlib import Path; import gpn; gpn.register_auto_classes(); assert version('gpn') == Path('/tmp/gpn-expected-version').read_text().strip()"
