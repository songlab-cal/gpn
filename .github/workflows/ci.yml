name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --python 3.13 --extra train --group dev

      - name: Run repository checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --python 3.13 --extra train --group dev

      - name: Run offline tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install documentation environment
        run: >-
          uv sync --locked --python 3.13
          --no-default-groups --group docs

      - name: Prepare static notebooks
        run: uv run --no-sync python docs/prepare_notebooks.py

      - name: Build documentation strictly
        run: >-
          uv run --no-sync sphinx-build -n -W --keep-going
          -b html docs docs/_build/html

      - name: Upload documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-preview
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked build tools
        run: >-
          uv sync --locked --python 3.13
          --only-group release --no-install-project

      - name: Build and check distributions
        run: |
          uv build --no-build-isolation
          uv run --no-sync twine check dist/*
          uv run --no-sync check-wheel-contents dist/*.whl

      - name: Rebuild wheel from source distribution
        run: |
          mkdir -p /tmp/gpn-wheel-from-sdist
          uv build --no-build-isolation \
            dist/gpn-*.tar.gz --wheel --out-dir /tmp/gpn-wheel-from-sdist
          uv run --no-sync twine check /tmp/gpn-wheel-from-sdist/*.whl
          uv run --no-sync check-wheel-contents /tmp/gpn-wheel-from-sdist/*.whl

      - name: Smoke-test installed wheel outside the checkout
        run: |
          uv version --short > /tmp/gpn-expected-version
          uv venv --python 3.13 /tmp/gpn-wheel-smoke
          uv pip install \
            --python /tmp/gpn-wheel-smoke/bin/python \
            --torch-backend cpu \
            --no-config \
            /tmp/gpn-wheel-from-sdist/*.whl
          cd /tmp
          /tmp/gpn-wheel-smoke/bin/gpn --version
          /tmp/gpn-wheel-smoke/bin/gpn --help
          /tmp/gpn-wheel-smoke/bin/python -c \
            "from importlib.metadata import version; from pathlib import Path; import gpn; gpn.register_auto_classes(); assert version('gpn') == Path('/tmp/gpn-expected-version').read_text().strip()"
