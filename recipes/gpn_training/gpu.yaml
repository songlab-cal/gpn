# Four-GPU starting point for GPN training.
dataset_name: songlab/genomes-brassicales-balanced-v1
dataset_revision: d11c6084dd2bb5575f9ce224cbcc435a687e67bf
tokenizer_name: songlab/gpn-brassicales
model_revision: eb9c35d0d18571abe84390d22e74f2b21d319ce3
config_overrides: encoder=convnet,num_hidden_layers=25,hidden_size=512,intermediate_size=2048,first_kernel_size=9,rest_kernel_size=5,dilation_cycle=8,dilation_max=9999

do_train: true
do_eval: true
max_steps: 120000
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
gradient_accumulation_steps: 8
map_batch_size: 2048

mlm_probability: 0.15
soft_masked_loss_weight_train: 0.1
soft_masked_loss_weight_evaluation: 0.0
learning_rate: 0.001
lr_scheduler_type: constant_with_warmup
warmup_steps: 1000
weight_decay: 0.01
optim: adamw_torch
seed: 42

dataloader_num_workers: 4
remove_unused_columns: false
prediction_loss_only: true
eval_strategy: steps
eval_steps: 10000
save_strategy: steps
save_steps: 10000
save_total_limit: 2
logging_steps: 1000
bf16: true
bf16_full_eval: true
torch_compile: true
ddp_find_unused_parameters: false
report_to: []
output_dir: outputs/gpn
run_name: gpn-canonical
